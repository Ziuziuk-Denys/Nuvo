# Generated by .github/readme/build.py. Edit .github/readme/pages/ and data.json, not this file.
name: Bug report
description: Something in Nuvo does not work as it should.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        <picture><source media="(prefers-color-scheme: dark)" srcset="https://github.com/Ziuziuk-Denys/Nuvo/raw/main/.github/readme/banner-dark.png"><img src="https://github.com/Ziuziuk-Denys/Nuvo/raw/main/.github/readme/banner-light.png" width="100%" alt="Nuvo"></picture>

        Search existing issues first. For a security problem, use the [private route](https://github.com/Ziuziuk-Denys/Nuvo/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nuvo version
      description: Settings, Application, About.
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options: [AppImage, deb, rpm, Windows installer, Windows portable, macOS dmg, Built from source, Other]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: The system and its version. On Linux, also the desktop and Wayland or X11.
      placeholder: Fedora 44, GNOME, Wayland / Windows 11 / macOS 15
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Support report and network state
      description: Settings, Application, Network, "Check connection", then "Copy report". Paste the result. It has no library, paths or passwords. Say whether you use a proxy or a VPN.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Service log
      description: The last lines around the problem from `~/.local/state/nuvo/core.log` on Linux and macOS, or `%LOCALAPPDATA%\nuvo\core.log` on Windows. It records routes and timings, not track ids. Check it before pasting.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a screen recording, whether it happens in safe mode.
