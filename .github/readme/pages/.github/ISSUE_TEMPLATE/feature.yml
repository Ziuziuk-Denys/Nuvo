name: Feature request
description: Suggest something Nuvo should do.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        {{form-head}}
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Nuvo makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. A sketch or a link to another player's behavior helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
  - type: checkboxes
    id: local
    attributes:
      label: Fit
      options:
        - label: It works without a Nuvo account or server, and does not send library data anywhere.
          required: true
        - label: I searched the [roadmap]({{site}}/docs/roadmap) and open issues.
          required: true
