name: nix
on:
  pull_request:
    # The build reads these files; pnpm-lock.yaml and pnpm-workspace.yaml set pnpmDeps.hash, core/Cargo.lock feeds cargoLock
    paths: ["flake.nix", "flake.lock", "nix/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "core/Cargo.lock"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix build .#default -L
      - run: test -x result/bin/nuvo && test -e result/lib/nuvo/core/target/debug/nuvo-core
