[package]
name = "nuvo-net"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Local fixture server for other crates' tests: `nuvo-net = { workspace = true, features = ["fixture"] }`.
fixture = ["dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
nuvo-fetch.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
# The crate's own tests use the fixture too.
nuvo-net = { path = ".", features = ["fixture"] }
