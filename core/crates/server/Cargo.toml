[package]
name = "nuvo-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "nuvo-core"
path = "src/main.rs"

[dependencies]
nuvo-align.workspace = true
nuvo-cache.workspace = true
nuvo-contracts.workspace = true
nuvo-covers.workspace = true
nuvo-crypto.workspace = true
nuvo-fetch.workspace = true
nuvo-import.workspace = true
nuvo-lastfm.workspace = true
nuvo-local.workspace = true
nuvo-lyrics.workspace = true
nuvo-match.workspace = true
nuvo-net.workspace = true
nuvo-recs.workspace = true
nuvo-recognize.workspace = true
nuvo-soundcloud.workspace = true
nuvo-store.workspace = true
axum.workspace = true
notify.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# The lyrics a word timing belongs to are known by their hash; already a dependency of nuvo-fetch.
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# statvfs for the free-space check before a save; already in the lock through nuvo-fetch
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Free space and the pipe DACL; already in the lock through the Windows keyring store.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

# macOS and Windows have no system OpenSSL 3 for SQLCipher to link, so a release carries its own copy there
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
http-body-util.workspace = true
image.workspace = true
tempfile.workspace = true
# A self-signed TLS server for the network check test; already in the lock through reqwest.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tower.workspace = true
nuvo-net = { workspace = true, features = ["fixture"] }
